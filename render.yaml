services:
  # Frontend Static Site
  - type: web
    name: student-learning-platform-frontend
    rootDir: .
    buildCommand: "npm run build:static"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: NODE_VERSION
        value: 18
    autoDeploy: true
