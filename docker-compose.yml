version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: student-learning-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_learning_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - student-learning-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student-learning-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_DATABASE: student_learning_platform
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 24h
      FRONTEND_URL: http://localhost:4200
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - student-learning-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-learning-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - student-learning-network

volumes:
  postgres_data:

networks:
  student-learning-network:
    driver: bridge
