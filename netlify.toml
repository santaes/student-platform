[build]
  command = "npm run build && cd backend && npm install && npm run build"
  publish = "dist/student-learning-platform/browser"
  functions = "backend/netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[plugins]]
  package = "@netlify/angular-runtime"
